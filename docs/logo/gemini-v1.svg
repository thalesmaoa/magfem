<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Elemento Esquerdo (Polo Norte) -->
  <polygon points="8,32 26,14 26,50" fill="#FF3B30"/>
  
  <!-- Elemento Direito (Polo Sul) -->
  <polygon points="56,32 38,14 38,50" fill="#007AFF"/>
  
  <!-- Linhas de Fluxo Magnético -->
  <g stroke="#FFCC00" stroke-width="2.5" stroke-linecap="round" fill="none">
    <!-- Fluxo cruzando o entreferro (air gap) -->
    <path d="M 26,22 L 38,22" />
    <path d="M 26,32 L 38,32" />
    <path d="M 26,42 L 38,42" />
    
    <!-- Fluxo externo formando um loop fechado -->
    <path d="M 8,32 A 24,24 0 0,1 56,32" />
    <path d="M 8,32 A 24,24 0 0,0 56,32" />
  </g>
</svg>
