<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Metade Esquerda (Polo Norte) -->
  <polygon points="32,10 12,46 32,46" fill="#FF3B30"/>
  
  <!-- Metade Direita (Polo Sul) -->
  <polygon points="32,10 52,46 32,46" fill="#007AFF"/>
  
  <!-- Linhas Estruturais da Malha FEM (Cor baseada no dark theme pedido) -->
  <path d="M 32,10 L 32,46 M 22,28 L 42,28 M 22,28 L 32,46 M 42,28 L 32,46" 
        stroke="#243447" stroke-width="2.5" stroke-linejoin="round" fill="none"/>
        
  <!-- Linhas de Fluxo Magnético trançando o triângulo -->
  <g stroke="#FFCC00" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 22,28 A 10,10 0 0,1 42,28" />
    <path d="M 12,46 A 28,28 0 0,0 52,46" />
  </g>
</svg>
